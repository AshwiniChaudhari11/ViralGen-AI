<!DOCTYPE html>
<html>
<head>
    <title>ViralGen AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1 class="title">🤖 ViralGen AI — Create Like a Pro with AI✨</h1>

<div class="container">

    <!-- COPY GENERATOR -->
    <div class="card">
        <h2>Generate Marketing Copy</h2>

        <input id="desc" placeholder="Product description">

        <select id="platform">
            <option>Instagram</option>
            <option>LinkedIn</option>
            <option>Twitter</option>
        </select>

        <!-- PERSONA DROPDOWN -->
    <select id="persona">

    <option value="professional">
        Professional (Formal Business Tone)
    </option>

    <option value="witty">
        Witty (Fun & Social Media Style)
    </option>

    <option value="urgent">
        Urgent (High Conversion Marketing)
    </option>

</select>

        <button onclick="generateCopy()">Generate Copy</button>

        <div id="copyOutput" class="output"></div>
    </div>


    <!-- IMAGE GENERATOR -->
    <div class="card">
        <h2>Generate AI Image</h2>

        <input id="imageDesc" placeholder="Describe image...">

        <button onclick="generateImage()">Generate Image</button>

        <p id="imageStatus" class="status"></p>

        <!-- IMAGE PREVIEW -->
        <div id="imageResult" class="image-result" style="display:none;">

    <!-- Small Preview -->
    <img id="previewImage" class="preview-img" />

    <br>

    <!-- Download Button -->
    <button id="downloadBtn" class="download-btn">
        ⬇ Download Image
    </button>

</div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
